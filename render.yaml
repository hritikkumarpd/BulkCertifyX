# Render blueprint: BulkCertifyX API + Workers (100% Free Tier)
# Both API and Background Workers run inside one Free Web Service.
# Frontend deploys to Vercel separately.
services:
  - type: web
    name: bulkcertifyx-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    dockerCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RUN_WORKERS_IN_API
        value: "true"
